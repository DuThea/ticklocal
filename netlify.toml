[build]
  command = "npm run build"
  publish = "dist"

# Don't cache the service worker and manifest for long, so users' devices get new versions
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
