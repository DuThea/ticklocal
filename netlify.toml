[build]
  command = "npm run build"
  publish = "dist"

# Service worker và manifest không được cache lâu, để máy người dùng nhận bản mới
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
